# ---- Server ----
server.port=8080

# ---- PostgreSQL ----
spring.datasource.url=jdbc:postgresql://localhost:5432/authapp_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
# 256-bit+ secret required for HS256. Replace with your own secret in production
# (e.g. via an environment variable) and never commit real secrets.
app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_BYTES_LONG_1234567890
app.jwt.expiration-ms=86400000
