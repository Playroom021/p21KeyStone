server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend (Docker Compose service name "backend")
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /v3/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
    location /swagger-ui { proxy_pass http://backend:8080; proxy_set_header Host $host; }

    # React Router: fall back to index.html for client-side routes
    location / {
        try_files $uri /index.html;
    }
}
