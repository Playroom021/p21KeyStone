# =========================================================
# KEYSTONE backend configuration
# All values are environment-variable driven. Each has a
# local-development fallback after the ':' so the app still
# runs out of the box against a local PostgreSQL instance.
# See .env.example for the full list of variables.
# =========================================================

# ---- Server ----
server.port=${SERVER_PORT:8080}
 
# ---- PostgreSQL ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/authapp_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# Schema is now owned by Flyway (see db/migration). Hibernate must never
# create/alter the production schema itself: ddl-auto is "validate", which
# only checks entity mappings against the existing tables at startup and
# fails fast on drift. It does not create, alter, or drop anything.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Flyway ----
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

# ---- JWT ----
# Existing JWT support (from the prior AuthApp build) is preserved as-is.
# No JWT logic changes in this phase; only the secret/expiry source moved
# to environment variables. Always override JWT_SECRET outside local dev -
# never commit a real secret.
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_BYTES_LONG_1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- SLA (Step 7) ----
# Hours from creation until the SLA due time, by priority.
app.sla.critical-hours=${SLA_CRITICAL_HOURS:4}
app.sla.high-hours=${SLA_HIGH_HOURS:24}
app.sla.medium-hours=${SLA_MEDIUM_HOURS:48}
app.sla.low-hours=${SLA_LOW_HOURS:72}
# AT_RISK once the time remaining is this % (or less) of the whole SLA window.
app.sla.at-risk-percent=${SLA_AT_RISK_PERCENT:25}
# Scheduled SLA sweep.
app.sla.scheduler.enabled=${SLA_SCHEDULER_ENABLED:true}
app.sla.check-interval-ms=${SLA_CHECK_INTERVAL_MS:60000}
app.sla.check-initial-delay-ms=${SLA_CHECK_INITIAL_DELAY_MS:30000}
