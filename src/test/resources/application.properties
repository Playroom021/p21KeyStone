# Test-only configuration: an in-memory H2 database so the Spring context
# can load in CI/local `mvn test` runs without a real PostgreSQL instance.
# This file does NOT affect the real application.properties used at runtime.
spring.datasource.url=jdbc:h2:mem:authapp_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Flyway migrations are PostgreSQL-specific SQL (BIGSERIAL, TIMESTAMPTZ,
# REFERENCES) and are not run against the H2 test database. Hibernate
# ddl-auto=update is used here ONLY for this in-memory test context, never
# against a real/production database (Flyway owns that schema - see
# src/main/resources/db/migration and main application.properties).
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=TEST_ONLY_SECRET_NOT_FOR_PRODUCTION_USE_1234567890
app.jwt.expiration-ms=86400000

# Step 7: the SLA scheduler is off by default in tests so background sweeps cannot interfere
# with other tests; SlaSchedulerIntegrationTest turns it on explicitly.
app.sla.scheduler.enabled=false
